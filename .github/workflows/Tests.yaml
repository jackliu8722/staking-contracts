name: Tests
on:
  push:

jobs:
  run-tests:
    runs-on: fixed-egress-4c-16g

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Install Foundry
        uses: onbjerg/foundry-toolchain@v1
        with:
          version: nightly

      - run: forge test --force -vvv --nmc __FORK
        env:
          FOUNDRY_FUZZ_RUNS: 2560
