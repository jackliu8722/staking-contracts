name: Mythril Checks
on:
  push:

jobs:
  run-mythril:
    runs-on: fixed-egress-4c-16g

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: StakingContract
        uses: ./actions/mythril
        id: staking-contract
        with:
          contract: './contracts/src/StakingContract'
